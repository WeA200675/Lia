name: API quality
on:
  pull_request:
  push:
    branches: ['repo-health-B/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
